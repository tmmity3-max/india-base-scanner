name: Daily scan

# Runs after NSE closes (15:30 IST) so the website shows the latest setups.
# 11:23 UTC = 16:53 IST, Monday to Friday. Run it any time from the Actions tab.
on:
  schedule:
    - cron: "23 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_screens.py

      - name: Run the scan
        run: python scripts/daily_scan.py --universe NIFTY500 --benchmark NIFTY500

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily scan $(date -u +%Y-%m-%d)"
            git push
          fi
